<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Static Site - Pure HTML/CSS/JS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="badge">Static Site (Zero Build)</div>
    <h1>Platform Verification</h1>
    <p>This static site requires <strong>no build step</strong>. Files are served directly from the repository root.</p>

    <div class="info-box">
      <div><strong>Status:</strong> <span class="status-ok">● Online</span></div>
      <div><strong>Publish Directory:</strong> <code>./</code> or <code>public</code></div>
      <div><strong>Client Time:</strong> <span id="client-time"></span></div>
    </div>

    <div class="actions">
      <a href="about.html" class="btn">View About Page</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
